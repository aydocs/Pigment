name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small Go example and exact input where possible.
      render: go
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: v0.1.0, Go 1.21, Linux amd64
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I have not included secrets or private data.
          required: true
